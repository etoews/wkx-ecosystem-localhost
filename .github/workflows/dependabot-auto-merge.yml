name: Dependabot auto-merge

# Turns on GitHub auto-merge (rebase) for each Dependabot PR. GitHub then
# rebase-merges the PR once every required status check passes; the
# "dependabot-auto-merge" ruleset on main makes the CI "test" job required.
# The workflow checks out nothing and runs no PR code: it only calls the API.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    # The PR author, not the actor: a rerun by the owner still qualifies, and a
    # PR opened by anyone else never does.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'etoews/wkx-ecosystem-localhost'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
