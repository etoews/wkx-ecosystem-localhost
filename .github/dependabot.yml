# Dependabot watches the lock file and the workflow. No gitsubmodule ecosystem:
# standards/python is pinned to a release on purpose, and Dependabot tracks a
# branch head, not a tag. The chore prefix keeps the log Conventional.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
