<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" role="img" aria-label="The CI gates of WKX Ecosystem localhost: the hooks on the laptop, and the run in GitHub that repeats them">
  <style>
    svg {
      /* night, the identity default */
      --deep: #0A141E;
      --water: #0E1C2A;
      --hull: #14273A;
      --line: #21374C;
      --text: #E8F0F6;
      --fog: #8AA3B5;
      --add: #3DDC97;
      --del: #FF6257;
      --chg: #F5B84A;
      --masthead: #FFFFFF;
    }
    @media (prefers-color-scheme: light) {
      svg {
        --deep: #EEF3F6;
        --water: #FFFFFF;
        --hull: #DFE8EE;
        --line: #C6D3DC;
        --text: #182634;
        --fog: #5B7284;
        --add: #0F8A5F;
        --del: #C3362B;
        --chg: #A06E00;
        --masthead: #0A141E;
      }
    }
    /* when inline in a page, the viewer's theme toggle wins in both directions */
    :root[data-theme="light"] svg {
      --deep: #EEF3F6;
      --water: #FFFFFF;
      --hull: #DFE8EE;
      --line: #C6D3DC;
      --text: #182634;
      --fog: #5B7284;
      --add: #0F8A5F;
      --del: #C3362B;
      --chg: #A06E00;
      --masthead: #0A141E;
    }
    :root[data-theme="dark"] svg {
      --deep: #0A141E;
      --water: #0E1C2A;
      --hull: #14273A;
      --line: #21374C;
      --text: #E8F0F6;
      --fog: #8AA3B5;
      --add: #3DDC97;
      --del: #FF6257;
      --chg: #F5B84A;
      --masthead: #FFFFFF;
    }

    text { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mast { font-family: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 4px; fill: var(--masthead); }
    .dim  { fill: var(--fog); font-weight: 500; }
    .sub  { font-family: ui-monospace, "Menlo", "SF Mono", monospace; font-size: 12px; fill: var(--fog); }
    .sign { font-family: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2.5px; fill: var(--fog); }
    .lane-h { font-family: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: var(--fog); }
    .path { font-family: ui-monospace, "Menlo", "SF Mono", monospace; font-size: 12.5px; font-weight: 400; letter-spacing: 0; fill: var(--text); }
    .mono { font-family: ui-monospace, "Menlo", "SF Mono", monospace; font-size: 12.5px; fill: var(--text); }
    .lblt { font-family: ui-monospace, "Menlo", "SF Mono", monospace; font-size: 12px; fill: var(--text); }
    .small { font-size: 12px; fill: var(--fog); }

    .bg   { fill: var(--deep); }
    .deck { fill: var(--water); stroke: var(--line); }
    .bar  { fill: var(--fog); }
    .chip { fill: var(--hull); stroke: var(--line); }
    .tile { fill: var(--deep); stroke: var(--line); }
    .rail { stroke: var(--fog); stroke-width: 2; fill: none; }
    .head { fill: var(--fog); }
    .dot-r { fill: var(--del); }
    .dot-a { fill: var(--chg); }
    .dot-g { fill: var(--add); }
  </style>

  <rect class="bg" width="920" height="760"/>

  <!-- masthead -->
  <text class="mast" x="40" y="64">WKX <tspan class="dim">ECOSYSTEM LOCALHOST</tspan></text>
  <text class="sub" x="880" y="60" text-anchor="end">the gates · laptop and GitHub</text>

  <!-- ============ lane 1 · the laptop ============ -->
  <rect class="deck" x="40" y="100" width="404" height="600"/>
  <rect class="bar" x="40" y="100" width="404" height="3"/>
  <text class="sign" x="60" y="126">THE LAPTOP  ·  <tspan class="path">.pre-commit-config.yaml</tspan></text>
  <text class="small" x="60" y="148">hooks wired once by uv run pre-commit install</text>

  <text class="lane-h" x="60" y="176">WHO STARTS IT</text>
  <rect class="tile" x="60" y="186" width="364" height="32" rx="4"/>
  <text class="mono" x="76" y="206">you, or an agent, at the keyboard</text>

  <line class="rail" x1="80" y1="218" x2="80" y2="270"/>
  <path class="head" d="M75,270 h10 l-5,8 z"/>
  <text class="lblt" x="94" y="248">git commit</text>

  <text class="lane-h" x="60" y="302">ON GIT COMMIT</text>
  <rect class="chip" x="60"  y="312" width="136" height="30" rx="4"/>
  <text class="mono" x="128" y="331" text-anchor="middle">ruff check --fix</text>
  <rect class="chip" x="205" y="312" width="99"  height="30" rx="4"/>
  <text class="mono" x="254.5" y="331" text-anchor="middle">ruff format</text>
  <rect class="chip" x="313" y="312" width="76"  height="30" rx="4"/>
  <text class="mono" x="351" y="331" text-anchor="middle">ty check</text>
  <rect class="chip" x="60"  y="350" width="129" height="30" rx="4"/>
  <text class="mono" x="124.5" y="369" text-anchor="middle">uv lock --check</text>
  <rect class="chip" x="198" y="350" width="91"  height="30" rx="4"/>
  <text class="mono" x="243.5" y="369" text-anchor="middle">hygiene ×7</text>
  <rect class="chip" x="298" y="350" width="91"  height="30" rx="4"/>
  <text class="mono" x="343.5" y="369" text-anchor="middle">commit-msg</text>
  <circle class="dot-r" cx="66" cy="404" r="5"/>
  <text class="small" x="80" y="408">a hook fails · the commit is refused</text>
  <circle class="dot-a" cx="66" cy="422" r="5"/>
  <text class="small" x="80" y="426">git commit -n skips the gate</text>
  <circle class="dot-g" cx="66" cy="440" r="5"/>
  <text class="small" x="80" y="444">every hook passes · the commit lands</text>

  <line class="rail" x1="80" y1="460" x2="80" y2="512"/>
  <path class="head" d="M75,512 h10 l-5,8 z"/>
  <text class="lblt" x="94" y="490">git push</text>

  <text class="lane-h" x="60" y="544">ON GIT PUSH</text>
  <rect class="chip" x="60" y="554" width="62" height="30" rx="4"/>
  <text class="mono" x="91" y="573" text-anchor="middle">pytest</text>
  <circle class="dot-r" cx="66" cy="608" r="5"/>
  <text class="small" x="80" y="612">a test fails · the push is refused</text>
  <circle class="dot-a" cx="66" cy="626" r="5"/>
  <text class="small" x="80" y="630">git push --no-verify skips the gate</text>
  <rect class="tile" x="60" y="646" width="364" height="32" rx="4"/>
  <circle class="dot-g" cx="76" cy="662" r="5"/>
  <text class="mono" x="90" y="666">the suite is green · the push lands</text>

  <!-- ============ lane 2 · GitHub ============ -->
  <rect class="deck" x="476" y="100" width="404" height="600"/>
  <rect class="bar" x="476" y="100" width="404" height="3"/>
  <text class="sign" x="496" y="126">GITHUB  ·  <tspan class="path">.github/workflows/ci.yml</tspan></text>
  <text class="small" x="496" y="148">ubuntu-latest · read-only token · actions pinned by SHA</text>

  <text class="lane-h" x="496" y="176">WHAT STARTS A RUN</text>
  <rect class="tile" x="496" y="186" width="364" height="32" rx="4"/>
  <text class="mono" x="512" y="206">you, or an agent · git push of any branch</text>
  <rect class="tile" x="496" y="226" width="364" height="32" rx="4"/>
  <text class="mono" x="512" y="246">Dependabot · weekly, or on a security alert</text>
  <rect class="tile" x="496" y="266" width="364" height="32" rx="4"/>
  <text class="mono" x="512" y="286">you, in GitHub · rebase-merge of a PR</text>

  <line class="rail" x1="516" y1="298" x2="516" y2="350"/>
  <path class="head" d="M511,350 h10 l-5,8 z"/>
  <text class="lblt" x="530" y="328">push · pull_request</text>

  <text class="lane-h" x="496" y="382">THE RUN  ·  IN ORDER</text>
  <rect class="chip" x="496" y="392" width="136" height="30" rx="4"/>
  <text class="mono" x="564" y="411" text-anchor="middle">uv sync --locked</text>
  <rect class="chip" x="496" y="430" width="211" height="30" rx="4"/>
  <text class="mono" x="601.5" y="449" text-anchor="middle">pre-commit run --all-files</text>
  <rect class="chip" x="496" y="468" width="106" height="30" rx="4"/>
  <text class="mono" x="549" y="487" text-anchor="middle">pytest --cov</text>
  <text class="small" x="496" y="522">the pre-commit step is the laptop's commit stage</text>

  <line class="rail" x1="516" y1="536" x2="516" y2="588"/>
  <path class="head" d="M511,588 h10 l-5,8 z"/>
  <text class="lblt" x="530" y="566">a status check</text>

  <text class="lane-h" x="496" y="620">THE RESULT</text>
  <circle class="dot-r" cx="502" cy="636" r="5"/>
  <text class="small" x="516" y="640">a step fails · the check is red</text>
  <circle class="dot-g" cx="502" cy="654" r="5"/>
  <text class="small" x="516" y="658">every step passes · the badge on main</text>

  <!-- the push crosses from the laptop to GitHub -->
  <path class="rail" d="M424,662 H460 V202 H488"/>
  <path class="head" d="M488,197 v10 l8,-5 z"/>

  <!-- footer -->
  <text class="small" x="40" y="732">wkx-namespace design system · colour is for outcomes only: red refuses · amber skips a gate · green lands</text>
  <text class="sub" x="880" y="732" text-anchor="end">one hook set, run twice</text>
</svg>
