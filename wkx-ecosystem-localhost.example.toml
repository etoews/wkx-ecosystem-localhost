# WKX Ecosystem localhost configuration.
#
# Copy this file to wkx-ecosystem-localhost.toml in the working directory (the
# repo root) and uncomment what you want to change. Every key is optional: a
# missing file, or a missing key, falls back to a value computed at runtime, so
# the board runs with no configuration at all.
#
# Keys are flat and map one to one onto the Settings fields. Paths accept a
# leading ~, which expands to your home directory. This file holds no machine
# path, so it is safe to commit; the real wkx-ecosystem-localhost.toml is
# gitignored because it names your machine.
#
# Configuration lives here. Secrets do not: a secret (a SecretStr field) is read
# from .env instead. There are none today. Precedence, highest first: an explicit
# argument, an environment variable (WKX_ECO_LOCAL_*), .env, this file, then the
# computed default. To read this file from another path, set the env-only
# WKX_ECO_LOCAL_CONFIG_FILE.

# The directories scanned for git repositories. Discovery stops descending at the
# first .git. Default: ~/dev.
# scan_roots = ["~/dev"]

# The deepest directory level below a scan root that discovery descends into. A
# safety cap against a runaway scan; the generous default suits nested layouts.
# Default: 8.
# scan_depth = 8

# Globs that prune matching directories from repository discovery. Each glob is
# matched against the ~-relative path the board shows, for example ~/dev/scratch
# or **/vendor. Discovery does not descend into a matching directory and does not
# report any repository in it: an excluded repository is absent from the board and
# raises no flags. Use ** to match at any depth; a leading ~/ is accepted. The
# built-in prunes (hidden directories, node_modules, venv) always apply. Set this
# to add your own. Default: none.
# exclude = ["~/dev/scratch", "**/vendor"]

# The port bound on 127.0.0.1. The bind host is not configurable: the board is
# loopback-only by design. Default: 8787.
# port = 8787

# How many repositories are fetched at once by the background fetch pool.
# Default: 4.
# fetch_workers = 4

# The per-fetch wall-clock ceiling in seconds, so one unreachable remote can
# never hang the board. Default: 10.0.
# fetch_timeout = 10.0

# How long, in seconds, the disk footprint (du over each repo's .venv and
# node_modules) is cached before it is measured again, so a reload does not
# re-walk every tree. Default: 60.0.
# footprint_cache_ttl = 60.0

# How long, in seconds, one repository discovery walk is shared across a board
# load, so the several routes and the flag layer that ask for the repositories
# walk the scan roots once, not many times. The result is measured again after
# this window. Default: 60.0.
# discovery_cache_ttl = 60.0

# The Sections switched off. Each name must be one of the ten Sections:
# workspace, toolchains, claude, homebrew, system, docker, footprint, editor,
# git-config, config. An unknown name stops the board at startup. An Off Section
# is not collected, its /api/<section> route is not registered, and it raises no
# Flags; the board removes its panel before any request fires. Needs attention is
# not a Section and cannot go here. Default: none off.
# sections_off = ["docker", "editor"]

# The Flags to mute. This is an inline array of tables, one per rule. Each rule
# names a Flag category and, optionally, a target that narrows the mute to one
# item. A rule with no target mutes the whole category; a target matches the wire
# value exactly (a repository's ~-relative path, or a prefixed item such as
# formula:python@3.12 or skill:foo). An unknown category stops the board at
# startup. Muting is a view preference: a muted Flag does not badge its row and
# does not count in the tally, but the board still reports how many Flags it muted,
# and /api/flags still returns every Flag. It suppresses noise; it is not a
# ruleset. Default: none muted.
# mute = [
#   { category = "brew-outdated" },
#   { category = "dirty-tree", target = "~/dev/scratch" },
# ]

# The developer CLIs the system Section probes. Each entry is a [[system_tools]]
# table with a name and, optionally, the arguments that ask the tool its version
# (default ["--version"]). Setting this replaces the whole generic default list
# (git, gh, uv, ruff, ty, pre-commit, docker, terraform, aws, code, node), so
# list every tool you want probed.
# [[system_tools]]
# name = "git"
#
# [[system_tools]]
# name = "kubectl"
#
# [[system_tools]]
# name = "java"
# version_args = ["-version"]
